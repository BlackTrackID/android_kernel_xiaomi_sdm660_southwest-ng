name: Build Kernel lavender (4.19 + ReSukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/xiaomi/sdm660_defconfig"
      fragment:
        description: "Fragment config device (digabung di atas base)"
        required: true
        default: "vendor/xiaomi/lavender.config"
      resukisu_ref:
        description: "Branch/tag ReSukiSU"
        required: true
        default: "main"
      susfs_branch:
        description: "Branch SUSFS (simonpunk/susfs4ksu)"
        required: true
        default: "kernel-4.19"
      use_susfs:
        description: "Aktifkan SUSFS"
        type: boolean
        default: true

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: BlackTrackID
  KBUILD_BUILD_HOST: github-actions
  DEVICE: lavender
  ROM_TAG: crDroid-7.64-A11
  MK: >-
    O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev ccache cpio zip \
            python3 git curl patch lz4 xz-utils libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup toolchain (LLVM/Clang 18)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-18/bin/clang --version

      - name: Integrasi ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "${{ inputs.resukisu_ref }}"
          ls -la drivers/kernelsu* || true

      - name: Integrasi SUSFS
        if: ${{ inputs.use_susfs }}
        run: |
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git "$HOME/susfs"
          ls "$HOME/susfs/kernel_patches" || true

          cp -v "$HOME/susfs/kernel_patches/fs/"*.c fs/ 2>/dev/null || true
          cp -v "$HOME/susfs/kernel_patches/include/linux/"*.h include/linux/ 2>/dev/null || true

          PATCH=$(ls "$HOME/susfs/kernel_patches/"50_add_susfs_in_kernel-4.19*.patch | head -n1)
          echo "Apply: $PATCH"
          patch -p1 --no-backup-if-mismatch < "$PATCH" || true

          echo "=== Hasil reject (kalau ada, harus dipatch manual) ==="
          find . -name "*.rej" -print
          for f in $(find . -name "*.rej"); do
            echo "########## $f ##########"
            cat "$f"
          done

      - name: Pasang manual hook ReSukiSU/BakaSU (4.19 non-GKI)
        run: |
          python3 - <<'PY'
          import re, sys

          def read(p):
              return open(p, encoding="utf-8", errors="surrogateescape").read()

          def write(p, s):
              open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)

          def add_decl(s, decl):
              # sisipkan deklarasi setelah #include terakhir di bagian atas file
              ms = [m for m in re.finditer(r"^#include .*$", s, re.M) if s.count("\n", 0, m.start()) < 120]
              pos = ms[-1].end()
              return s[:pos] + "\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n" + decl + "#endif\n" + s[pos:]

          def hook(code):
              return "#ifdef CONFIG_KSU_MANUAL_HOOK\n" + code + "#endif\n"

          def fail(msg):
              print("GAGAL:", msg)
              sys.exit(1)

          # ---------- fs/stat.c ----------
          p = "fs/stat.c"
          s = read(p)
          if "ksu_handle_" not in s:
              old = "error = vfs_fstatat(dfd, filename, &stat, flag);"
              n = s.count(old)
              if n < 1:
                  fail("stat.c: vfs_fstatat tidak ditemukan")
              s = re.sub(r"^[ \t]*" + re.escape(old),
                         lambda m: hook("\tksu_handle_stat(&dfd, &filename, &flag);\n") + "\t" + old,
                         s, flags=re.M)
              i = s.find("SYSCALL_DEFINE2(newfstat,")
              if i < 0:
                  fail("stat.c: SYSCALL newfstat tidak ditemukan")
              j = s.find("\treturn error;", i)
              s = s[:j] + hook("\tksu_handle_newfstat_ret(&fd, &statbuf);\n") + s[j:]
              s = add_decl(s,
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                  "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n")
              write(p, s)
              print(p, "OK, hook vfs_fstatat x", n)

          # ---------- fs/exec.c ----------
          p = "fs/exec.c"
          s = read(p)
          if "ksu_handle_" not in s:
              old = "return __do_execve_file(fd, filename, argv, envp, flags, NULL);"
              if s.count(old) != 1:
                  fail("exec.c: pola do_execveat_common tidak cocok (ditemukan %d)" % s.count(old))
              new = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                     "\t{\n"
                     "\t\tint retval;\n"
                     "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                     "\t\tretval = __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
                     "\t\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n"
                     "\t\treturn retval;\n"
                     "\t}\n"
                     "#else\n"
                     "\t" + old + "\n"
                     "#endif")
              s = re.sub(r"^[ \t]*" + re.escape(old), lambda m: new, s, flags=re.M)
              s = add_decl(s,
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags, int *retval);\n")
              write(p, s)
              print(p, "OK")

          # ---------- fs/open.c ----------
          p = "fs/open.c"
          s = read(p)
          if "ksu_handle_" not in s:
              hk = hook("\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n")
              old = "return do_faccessat(dfd, filename, mode);"
              if s.count(old) == 1:
                  s = re.sub(r"^[ \t]*" + re.escape(old), lambda m: hk + "\t" + old, s, flags=re.M)
              else:
                  i = s.find("SYSCALL_DEFINE3(faccessat")
                  if i < 0:
                      fail("open.c: SYSCALL faccessat tidak ditemukan")
                  j = s.find("\tif (mode & ~S_IRWXO)", i)
                  if j < 0:
                      fail("open.c: pola faccessat (4.19-) tidak cocok")
                  s = s[:j] + hk + "\n" + s[j:]
              s = add_decl(s, "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n")
              write(p, s)
              print(p, "OK")

          # ---------- kernel/reboot.c ----------
          import os
          p = "kernel/reboot.c" if os.path.exists("kernel/reboot.c") else "kernel/sys.c"
          s = read(p)
          if "ksu_handle_sys_reboot" not in s:
              i = s.find("SYSCALL_DEFINE4(reboot")
              if i < 0:
                  fail(p + ": SYSCALL reboot tidak ditemukan")
              m = re.compile(r"\n[ \t]*int ret = 0;\n").search(s, i)
              if not m:
                  fail(p + ": 'int ret = 0;' tidak ditemukan di reboot")
              s = s[:m.end()] + hook("\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n") + s[m.end():]
              s = add_decl(s, "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n")
              write(p, s)
              print(p, "OK")
          PY

          git --no-pager diff --stat -- fs/stat.c fs/exec.c fs/open.c kernel/reboot.c kernel/sys.c || true

      - name: Siapkan defconfig
        run: |
          DEF="${{ inputs.defconfig }}"
          FRAG="${{ inputs.fragment }}"
          ls "arch/arm64/configs/$DEF" "arch/arm64/configs/$FRAG"
          echo "Base: $DEF | Fragment: $FRAG"

          mkdir -p out
          make $MK "$DEF"
          make $MK "$FRAG"

          # Config KernelSU/ReSukiSU + SUSFS (built-in, bukan LKM)
          cat >> out/.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF
          sed -i 's/^[[:space:]]*//' out/.config

          if [ "${{ inputs.use_susfs }}" != "true" ]; then
            sed -i '/CONFIG_KSU_SUSFS/d' out/.config
          fi
          make $MK olddefconfig

          echo "=== Cek config akhir ==="
          grep -E "^CONFIG_(DEBUG_KERNEL|KALLSYMS|KALLSYMS_ALL|KSU|KSU_MANUAL_HOOK)=" out/.config
          grep -q "^CONFIG_KALLSYMS_ALL=y" out/.config \
            || { echo "KALLSYMS_ALL ter-reset oleh olddefconfig (cek dependensi)"; exit 1; }

      - name: Build kernel
        run: |
          MAKE_ARGS="$MK"

          set -o pipefail
          if ! make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee build.log; then
            echo "=============== ERROR ASLI ==============="
            grep -nE "error:|Error [0-9]|undefined reference|No rule" build.log | head -n 40
            echo "=============== ULANG -j1 ==============="
            make -j1 $MAKE_ARGS 2>&1 | tail -n 60
            exit 1
          fi

          ls -la out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git AK3/README.md AK3/modules AK3/patch AK3/ramdisk

          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" AK3/
          elif [ -f "$BOOT/Image.gz" ]; then
            cp "$BOOT/Image.gz" AK3/
            # dtb ikut di-append jika ada
            find "$BOOT/dts" -name "*.dtb" -exec cat {} + > AK3/dtb 2>/dev/null || true
          else
            echo "Image tidak ditemukan"; exit 1
          fi

          cat > AK3/anykernel.sh <<'EOF'
          #!/system/bin/sh
          properties() { '
          kernel.string=BlackTrackID 4.19 | ReSukiSU + SUSFS
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          device.name2=lavender_in
          device.name3=
          device.name4=
          device.name5=
          supported.versions=11
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' AK3/anykernel.sh

          DATE=$(date +%Y%m%d-%H%M)
          cd AK3
          zip -r9 "../${DEVICE}-4.19-ReSukiSU-SUSFS-${ROM_TAG}-${DATE}.zip" . -x "*.git*"
          cd ..
          echo "ZIP_NAME=${DEVICE}-4.19-ReSukiSU-SUSFS-${ROM_TAG}-${DATE}" >> "$GITHUB_ENV"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: "*.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
