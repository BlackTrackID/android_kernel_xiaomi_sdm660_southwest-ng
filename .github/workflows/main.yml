name: Build Kernel lavender (4.19 + ReSukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/xiaomi/sdm660_defconfig"
      fragment:
        description: "Fragment config device (digabung di atas base)"
        required: true
        default: "vendor/xiaomi/lavender.config"
      resukisu_ref:
        description: "Branch/tag ReSukiSU"
        required: true
        default: "main"
      susfs_branch:
        description: "Branch SUSFS (simonpunk/susfs4ksu)"
        required: true
        default: "kernel-4.19"
      use_susfs:
        description: "Aktifkan SUSFS"
        type: boolean
        default: true

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: BlackTrackID
  KBUILD_BUILD_HOST: github-actions
  DEVICE: lavender
  ROM_TAG: crDroid-7.64-A11

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev ccache cpio zip \
            python3 git curl patch lz4 xz-utils libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Integrasi ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "${{ inputs.resukisu_ref }}"
          ls -la drivers/kernelsu* || true

      - name: Integrasi SUSFS
        if: ${{ inputs.use_susfs }}
        run: |
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git "$HOME/susfs"
          ls "$HOME/susfs/kernel_patches" || true

          cp -v "$HOME/susfs/kernel_patches/fs/"*.c fs/ 2>/dev/null || true
          cp -v "$HOME/susfs/kernel_patches/include/linux/"*.h include/linux/ 2>/dev/null || true

          PATCH=$(ls "$HOME/susfs/kernel_patches/"50_add_susfs_in_kernel-4.19*.patch | head -n1)
          echo "Apply: $PATCH"
          patch -p1 --no-backup-if-mismatch < "$PATCH" || true

          echo "=== Hasil reject (kalau ada, harus dipatch manual) ==="
          find . -name "*.rej" -print
          for f in $(find . -name "*.rej"); do
            echo "########## $f ##########"
            cat "$f"
          done

      - name: Siapkan defconfig
        run: |
          DEF="${{ inputs.defconfig }}"
          FRAG="${{ inputs.fragment }}"
          ls "arch/arm64/configs/$DEF" "arch/arm64/configs/$FRAG"
          echo "Base: $DEF | Fragment: $FRAG"

          mkdir -p out
          make O=out CC=clang "$DEF"
          make O=out CC=clang "$FRAG"

          # Config KernelSU/ReSukiSU + SUSFS (built-in, bukan LKM)
          cat >> out/.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF
          sed -i 's/^[[:space:]]*//' out/.config

          if [ "${{ inputs.use_susfs }}" != "true" ]; then
            sed -i '/CONFIG_KSU_SUSFS/d' out/.config
          fi
          make O=out CC=clang olddefconfig

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

          ls -la out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git AK3/README.md AK3/modules AK3/patch AK3/ramdisk

          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" AK3/
          elif [ -f "$BOOT/Image.gz" ]; then
            cp "$BOOT/Image.gz" AK3/
            # dtb ikut di-append jika ada
            find "$BOOT/dts" -name "*.dtb" -exec cat {} + > AK3/dtb 2>/dev/null || true
          else
            echo "Image tidak ditemukan"; exit 1
          fi

          cat > AK3/anykernel.sh <<'EOF'
          #!/system/bin/sh
          properties() { '
          kernel.string=BlackTrackID 4.19 | ReSukiSU + SUSFS
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          device.name2=lavender_in
          device.name3=
          device.name4=
          device.name5=
          supported.versions=11
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' AK3/anykernel.sh

          DATE=$(date +%Y%m%d-%H%M)
          cd AK3
          zip -r9 "../${DEVICE}-4.19-ReSukiSU-SUSFS-${ROM_TAG}-${DATE}.zip" . -x "*.git*"
          cd ..
          echo "ZIP_NAME=${DEVICE}-4.19-ReSukiSU-SUSFS-${ROM_TAG}-${DATE}" >> "$GITHUB_ENV"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: "*.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
