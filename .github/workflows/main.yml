name: Build Kernel Lavender 4.19 Non-Dynamic + ReSukiSU + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lld clang llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 patch

      - name: Setup ReSukiSU / BakaSU
        run: |
          curl -LSs "https://githubusercontent.com" | bash

      - name: Setup & Patch SUSFS (4.19)
        run: |
          git clone --depth=1 -b kernel-4.19 https://gitlab.com susfs4ksu
          
          # Salin file inti SUSFS ke source kernel
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          
          # Terapkan patch SUSFS ke kernel 4.19 (menggunakan --forward -N agar toleran terhadap minor hunk)
          patch -p1 --forward -N < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          
          # Bersihkan folder sementara susfs4ksu agar tidak mengganggu build
          rm -rf susfs4ksu

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3

      - name: Create Swap Space
        run: |
          sudo fallocate -l 4G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 1. Generate .config awal untuk Redmi Note 7 (Non-Dynamic)
          make O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip vendor/sdm660-perf_defconfig vendor/xiaomi/lavender.config
          
          # 2. Aktifkan ReSukiSU dan modul-modul SUSFS
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -d CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KSU_TRACEPOINT_HOOK
          
          # 3. Kunci semua opsi baru secara otomatis (mencegah infinite loop / hang)
          make O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip olddefconfig
          
          # 4. Compile Kernel
          make -j$(nproc) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 ../SouthWest-NG-Lavender-4.19-NonDyn-ReSukiSU-SUSFS.zip * -x .git README.md

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: SouthWest-NG-Lavender-4.19-NonDyn-ReSukiSU-SUSFS
          path: SouthWest-NG-Lavender-4.19-NonDyn-ReSukiSU-SUSFS.zip
